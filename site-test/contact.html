<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request an item | The Absolute Essential</title>
  <script src="https://collector.alessioyu.xyz/collector.js"></script>
  <link rel="stylesheet" href="assets/styles.css" />
  <script src="assets/nav.js" defer></script>
  <script src="assets/app.js" defer></script>
</head>
<body>
  <header></header>
  <main class="container" style="padding-bottom: 46px;">
    <section class="hero">
      <div class="card heroCard">
        <h1>Procurement Request</h1>
        <p>
          If there is something you consider absolutely essential and it is easy to source (Target-level availability),
          submit it here for review.
        </p>
      </div>
    </section>

    <section class="card panel">
      <form action="#" method="post">
        <div class="formRow">
          <div>
            <label for="name">Name</label>
            <input id="name" name="name" placeholder="Your name" required />
          </div>
          <div>
            <label for="priority">Priority</label>
            <select id="priority" name="priority" required>
                <option value="">Select…</option>
                <option>Minor inconvenience</option>
                <option>Major inconvenience</option>
                <option>I can’t survive</option>
            </select>
          </div>
        </div>

        <div class="formRow" style="margin-top:12px;">
          <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" required />
          </div>
          <div>
            <label for="item">Requested item</label>
            <input id="item" name="item" placeholder="Item name" required />
          </div>
        </div>

        <div style="margin-top:12px;">
          <label for="justification">Justification</label>
          <textarea id="justification" name="justification" placeholder="Explain why it is essential..." required></textarea>
        </div>

        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:12px;">
          <button class="btn primary" type="submit">Submit</button>
          <a class="btn" href="shop.html">Back to shop</a>
        </div>
      </form>
    </section>
  </main>

  <footer></footer>
</body>
</html>
